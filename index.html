<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول إلى فيسبوك</title>
    <!-- تضمين مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ربط ملف الـ CSS الخارجي (تأكد أنه في نفس المجلد) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="container mx-auto px-4 flex flex-col lg:flex-row items-center justify-center max-w-5xl py-12">
        
        <!-- القسم الأيمن: الشعار والنص التوضيحي -->
        <div class="lg:w-1/2 text-center lg:text-right mb-8 lg:mb-0 lg:pr-10">
            <h1 class="text-blue-600 text-5xl lg:text-6xl font-bold mb-4 font-sans">facebook</h1>
            <p class="text-gray-600 text-xl lg:text-2xl leading-snug">
                يساعدك فيسبوك على التواصل والمشاركة مع الأشخاص الذين يعرفونك.
            </p>
        </div>

        <!-- القسم الأيسر: نموذج تسجيل الدخول -->
        <div class="lg:w-1/2 w-full max-w-md">
            <div class="bg-white p-4 rounded-lg shadow-xl flex flex-col">
                <form id="loginForm" class="flex flex-col space-y-3">
                    <input type="text" id="email" name="email" placeholder="البريد الإلكتروني أو رقم الهاتف" required
                        class="border border-gray-300 rounded-md p-3.5 focus:outline-none focus:border-blue-500 text-base">
                    
                    <input type="password" id="password" name="password" placeholder="كلمة المرور" required
                        class="border border-gray-300 rounded-md p-3.5 focus:outline-none focus:border-blue-500 text-base">
                    
                    <button type="submit" id="submitBtn"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-md text-xl transition duration-200">
                        تسجيل الدخول
                    </button>
                </form>

                <div class="text-center my-3">
                    <a href="#" class="text-blue-600 text-sm hover:underline">هل نسيت كلمة المرور؟</a>
                </div>

                <hr class="my-2 border-gray-300">

                <div class="text-center py-4">
                    <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md text-base transition duration-200">
                        إنشاء حساب جديد
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت الخارجي -->
    <script src="script.js"></script>
</body>
</html>
